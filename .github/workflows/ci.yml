# ============================================================================
# BüKo — CI iş akışı
#
# Amaç: her PR ve main push'unda temel kaliteyi doğrulamak — tip kontrolü,
# birim testleri, build ve (yalnızca doğrulama amaçlı, push ETMEDEN) Docker
# imajının kurulabilirliği.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Aynı branch/PR için eski çalışan işleri iptal et (kaynak tasarrufu).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tip kontrolü + testler + build
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Bağımlılıkları kur (kilitli sürümlerle)
        run: npm ci

      # Randevu izleme PoC'sinin (watcher) TEK gerçek testi chromium ister.
      # Kurulmazsa `appointment-checker.spec.ts` SESSİZCE atlanırdı: CI 544/19,
      # yerel 553/16 — yani PoC'nin doğruluğu CI'da hiç sınanmıyordu. Bu, bu
      # projede dört kez ısırılan "araç ✓ diyor ama doğrulamıyor" sınıfının
      # aynısıdır (D-033/D-039/D-041); atlamayı kurmakla değil, YASAKLAMAKLA
      # kapatıyoruz — bkz. bir alttaki REQUIRE_PLAYWRIGHT.
      - name: Playwright tarayıcısını kur (chromium)
        run: npx playwright install --with-deps chromium

      - name: TypeScript tip kontrolü (derleme çıktısı üretmeden)
        run: npx tsc --noEmit

      # `scripts/` kök tsconfig'in include'unda DEĞİL (orada olsaydı
      # `nest build` çıktısı `dist/src/main.js`'e kayar ve Dockerfile'daki
      # `node dist/main.js` kırılırdı — ölçüldü, D-048). Ayrıca script'ler
      # `ts-node -T` ile koşuyor: `-T` = transpile-only, tip kontrolü YOK.
      # Yani bu adım olmadan `scripts/` hiç tip kontrolünden geçmiyor.
      - name: TypeScript tip kontrolü — scripts/
        run: npx tsc --noEmit -p tsconfig.scripts.json

      # `npm run lint` yerel geliştirme için `--fix` içerir (rahatlık); CI'da
      # aynı komutu kullanmak, otomatik düzeltilebilir bir hatayı ÇALIŞTIRICI
      # üzerinde sessizce onarıp yeşil çıkardı — asıl PR dalında hata dururken.
      # Bu projede "araç ✓ diyor ama gerçekte doğrulamıyor" sınıfı hatalar
      # (D-033/D-039/D-041) tam olarak bu türden sessiz maskeleme yüzünden
      # oldu; CI kapısı `--fix` OLMADAN, ham `eslint` ile çalışır.
      - name: ESLint
        run: npx eslint "{src,test,scripts}/**/*.ts"

      # REQUIRE_PLAYWRIGHT=1: tarayıcı yoksa test SKIP değil FAIL olur.
      # Kurulum adımı ileride bozulur/silinirse CI yeşil kalmaz.
      #
      # `--json --outputFile=jest-results.json`: aşağıdaki "Doküman senkron
      # kontrolü" adımının README.md'deki geçen-test sayısını gerçek Jest
      # sonucuyla karşılaştırabilmesi için makine-okunur bir çıktı üretir
      # (bkz. scripts/check-docs-sync.ts, D-054). `--outputFile` kullanınca
      # normal PASS/FAIL konsol çıktısı stderr'e kayar (stdout'ta değil) —
      # GitHub Actions ikisini de log'a yazdığı için görünürlük kaybolmaz.
      - name: Birim testleri (Jest)
        run: npx jest --ci --json --outputFile=jest-results.json
        env:
          REQUIRE_PLAYWRIGHT: "1"

      # README.md'deki iddia edilen rakamlar (geçen test sayısı, karar sayısı)
      # ile gerçek durum (DECISIONS.md, yukarıdaki Jest sonucu) arasında
      # otomatik çapraz doğrulama — D-050'nin ruhu: "iddia" ile "gerçek durum"
      # arasında birinin manuel güncellemeyi unutması CI'ı kırmalı.
      - name: Doküman senkron kontrolü
        run: npm run check:docs-sync
        env:
          JEST_RESULTS_JSON: jest-results.json

      - name: Üretim build (nest build)
        run: npm run build

  docker-build:
    name: Docker imajı build doğrulaması (push YOK)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      # HEDEF BİLİNÇLİ OLARAK VERİLMİYOR (D-038).
      # Railway'in Dockerfile builder'ı da hedefsiz build eder ve daima SON
      # aşamayı derler. CI burada `target: runtime` yazsaydı, aşamalar yanlış
      # sıraya alındığında (eskiden öyleydi) CI yeşil kalır, Railway ise
      # sessizce ~2 GB'lık Playwright imajını üretirdi. Hedefsiz build ederek
      # CI, üretimde gerçekte ne derleneceğini doğrular.
      - name: Varsayılan imajı build et (hedefsiz — Railway ile aynı yol)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # load: imajı yerel docker daemon'a aktarır — aşağıdaki
          # `docker run` doğrulaması buna ihtiyaç duyar.
          load: true
          tags: bueko:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Yukarıdaki build'in GERÇEKTEN `runtime` aşamasını ürettiğini kanıtla.
      # Ayırt edici işaretler: `runtime` Alpine + Node 22; `with-browsers`
      # Debian/jammy + Node 20 + önceden kurulu tarayıcı binary'leri.
      # Aşama sırası bozulursa (D-038) bu adım kırılır.
      - name: Varsayılan hedefin runtime olduğunu doğrula
        run: |
          NODE_VER="$(docker run --rm bueko:ci-check node -v)"
          echo "Node sürümü: $NODE_VER"
          case "$NODE_VER" in
            v22.*) echo "✓ Node 22" ;;
            *) echo "✗ Beklenen Node 22 — with-browsers (Node 20) derlenmiş olabilir"; exit 1 ;;
          esac

          if docker run --rm bueko:ci-check sh -c 'test -f /etc/alpine-release'; then
            echo "✓ Alpine tabanlı (runtime aşaması)"
          else
            echo "✗ Alpine DEĞİL — varsayılan hedef runtime değil, Dockerfile aşama sırası bozulmuş (D-038)"
            exit 1
          fi

          # NOT: `node_modules/playwright` bu imajda BULUNUR — playwright bir
          # optionalDependency ve `npm ci --omit=dev` optional'ları atmaz (~18 MB).
          # Asıl maliyet tarayıcı BINARY'leridir; `--ignore-scripts` sayesinde
          # onlar indirilmez. Doğrulanması gereken budur:
          if docker run --rm bueko:ci-check sh -c 'test -d /ms-playwright -o -d "$HOME/.cache/ms-playwright"'; then
            echo "✗ Üretim imajında tarayıcı binary'leri var — imaj gereksiz büyümüş"
            exit 1
          fi
          echo "✓ tarayıcı binary'si içermiyor"
