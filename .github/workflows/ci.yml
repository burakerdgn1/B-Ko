# ============================================================================
# BüKo — CI iş akışı
#
# Amaç: her PR ve main push'unda temel kaliteyi doğrulamak — tip kontrolü,
# birim testleri, build ve (yalnızca doğrulama amaçlı, push ETMEDEN) Docker
# imajının kurulabilirliği.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Aynı branch/PR için eski çalışan işleri iptal et (kaynak tasarrufu).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tip kontrolü + testler + build
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Bağımlılıkları kur (kilitli sürümlerle)
        run: npm ci

      - name: TypeScript tip kontrolü (derleme çıktısı üretmeden)
        run: npx tsc --noEmit

      - name: Birim testleri (Jest)
        run: npx jest --ci

      - name: Üretim build (nest build)
        run: npm run build

  docker-build:
    name: Docker imajı build doğrulaması (push YOK)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: Üretim imajını (runtime hedefi) build et — sadece doğrulama
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: bueko:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
